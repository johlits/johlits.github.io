<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>johlits.github.io</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #unmute-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 16px;
            font-size: 14px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
        }
        #unmute-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }
        #unmute-btn.hidden {
            display: none;
        }
        .overlay {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            padding: 16px 24px;
            font-family: "Comic Sans MS", "Chalkboard SE", cursive;
            font-size: 22px;
            line-height: 1.6;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay table {
            border-collapse: collapse;
        }
        .overlay td {
            padding: 2px 14px;
            text-align: center;
        }
        .overlay td:first-child {
            text-align: left;
            padding-left: 0;
        }
        .overlay.visible {
            display: block;
        }
        #sunrise-overlay {
            bottom: 60px;
        }
        #sunset-overlay {
            top: 20px;
        }
    </style>
</head>
<body>
    <video id="video" src="sun.mp4" autoplay loop muted playsinline></video>
    <button id="unmute-btn">Unmute</button>
    <div id="sunrise-overlay" class="overlay"></div>
    <div id="sunset-overlay" class="overlay"></div>
    <script>
        const video = document.getElementById('video');
        const btn = document.getElementById('unmute-btn');
        const sunriseOverlay = document.getElementById('sunrise-overlay');
        const sunsetOverlay = document.getElementById('sunset-overlay');

        btn.addEventListener('click', () => {
            video.muted = false;
            btn.classList.add('hidden');
        });

        video.addEventListener('timeupdate', () => {
            const t = video.currentTime;
            sunriseOverlay.classList.toggle('visible', t >= 10 && t <= 30);
            sunsetOverlay.classList.toggle('visible', t >= 33 && t <= 49);
        });

        const cities = [
            { name: 'Lund', lat: 55.71, lon: 13.19 },
            { name: 'Sthlm', lat: 59.33, lon: 18.07 },
            { name: 'Lycksele', lat: 64.60, lon: 18.67 },
            { name: 'Kiruna', lat: 67.86, lon: 20.23 }
        ];

        function extractTime(iso) {
            if (!iso) return null;
            return iso.split('T')[1].substring(0, 5).replace(':', '.');
        }

        function diffMinutes(todayIso, lastWeekIso) {
            if (!todayIso || !lastWeekIso) return null;
            const today = new Date(todayIso);
            const lastWeek = new Date(lastWeekIso);
            const todayMin = today.getHours() * 60 + today.getMinutes();
            const lastWeekMin = lastWeek.getHours() * 60 + lastWeek.getMinutes();
            const diff = todayMin - lastWeekMin;
            return diff === 0 ? '-' : (diff > 0 ? '+' + diff : diff.toString());
        }

        function buildTable(rows) {
            let html = '<table>';
            for (const row of rows) {
                html += '<tr>' + row.map(c => '<td>' + c + '</td>').join('') + '</tr>';
            }
            html += '</table>';
            return html;
        }

        async function fetchSunData() {
            const results = await Promise.all(cities.map(async city => {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&daily=sunrise,sunset&timezone=Europe%2FStockholm&past_days=7`;
                const res = await fetch(url);
                const data = await res.json();
                return {
                    name: city.name,
                    todaySunrise: data.daily.sunrise[7],
                    todaySunset: data.daily.sunset[7],
                    lastWeekSunrise: data.daily.sunrise[0],
                    lastWeekSunset: data.daily.sunset[0]
                };
            }));

            const headers = [''].concat(cities.map(c => c.name));
            const sunriseToday = ['Idag'].concat(results.map(r => extractTime(r.todaySunrise) ?? 'o h'));
            const sunriseLast = ['Förra veckan'].concat(results.map(r => extractTime(r.lastWeekSunrise) ?? 'o h'));
            const sunriseDiff = ['Tidsskillnad'].concat(results.map(r => diffMinutes(r.todaySunrise, r.lastWeekSunrise) ?? '-'));
            sunriseOverlay.innerHTML = buildTable([headers, sunriseToday, sunriseLast, sunriseDiff]);

            const sunsetToday = ['Idag'].concat(results.map(r => extractTime(r.todaySunset) ?? 'o h'));
            const sunsetLast = ['Förra veckan'].concat(results.map(r => extractTime(r.lastWeekSunset) ?? 'o h'));
            const sunsetDiff = ['Tidsskillnad'].concat(results.map(r => diffMinutes(r.todaySunset, r.lastWeekSunset) ?? '-'));
            sunsetOverlay.innerHTML = buildTable([headers, sunsetToday, sunsetLast, sunsetDiff]);
        }

        fetchSunData().catch(err => {
            console.error('Weather API failed:', err);
            sunriseOverlay.textContent = 'Kunde inte ladda soluppgångsdata';
            sunsetOverlay.textContent = 'Kunde inte ladda solnedgångsdata';
        });
    </script>
</body>
</html>
